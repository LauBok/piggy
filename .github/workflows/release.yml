# Pushing a version tag (e.g. v0.2.0, made by `npm version patch`) builds the Windows and Mac
# apps and publishes them to a GitHub Release, where installed pigs find the update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create the release once up front, so the two platform builds don't race to create it
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    strategy:
      # one platform failing shouldn't cancel the other
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no Apple certificate: build unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # The signed game-content bundle that installed apps pick up without a reinstall
  content:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/build-content.js
        env:
          CONTENT_SIGNING_KEY: ${{ secrets.CONTENT_SIGNING_KEY }}
      - run: gh release upload "$GITHUB_REF_NAME" dist/content/content.json dist/content/content.json.sig --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
